# Too Soon Games API - one Worker for every game. See ../../docs/ARCHITECTURE.md.
name = "toosoon-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# The API answers on api.toosoongames.app (custom domain: DNS record + certificate managed by Cloudflare) and on workers.dev.
routes = [{ pattern = "api.toosoongames.app", custom_domain = true }]

# Deployed version string, shown by GET /v1/version. /deploy-server bumps it.
[vars]
VERSION = "0.1.15"
# Comma-separated origins allowed to call the API. localhost is always allowed in `wrangler dev`.
ALLOWED_ORIGINS = "https://toosoongames.app,https://www.toosoongames.app,https://toosoon-games.pages.dev"
# Analytics Engine dataset name (must match the binding below) - used by the admin SQL queries.
EVENTS_DATASET = "toosoon_events"
# Sign-up (routes/auth.ts). The client ids are public and must match studio.json (googleClientId, appleClientId);
# an empty one turns that way in off. Setup: docs/SETUP-CLOUDFLARE.md, "Sign-up".
PUBLIC_BASE = "https://toosoongames.app"
GOOGLE_CLIENT_ID = ""
APPLE_CLIENT_ID = ""

# Secrets (never in this file): `wrangler secret put <NAME>`; locally in .dev.vars
#   ADMIN_KEY      - protects /admin and /v1/admin/*
#   CF_ACCOUNT_ID  - for Analytics Engine SQL queries (admin dashboard)
#   CF_API_TOKEN   - token with "Account Analytics: Read"

# Scores, users, players, games. `database_id` is filled by /deploy-server after `wrangler d1 create toosoon`.
[[d1_databases]]
binding = "DB"
database_name = "toosoon"
database_id = "45794694-3abd-4a42-ae9a-e3be4f03e62c"
migrations_dir = "migrations"

# Every analytics event goes here (write-heavy, SQL queries from the admin page).
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "toosoon_events"

# Per-IP rate limits (free). period must be 10 or 60 seconds.
[[unsafe.bindings]]
name = "RL_SCORES"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RL_EVENTS"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

# Leaderboard and player-count reads. A normal visit makes a handful (the home page: one count per game and a board;
# a game: a count, and a board per run). The cap stops a loop or a script from running up D1 reads, which the Workers
# spending limit does not cover.
[[unsafe.bindings]]
name = "RL_READS"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 120, period = 60 }

# Sign-up and sign-in calls (a Google / Apple sign-in may fetch the provider's keys).
[[unsafe.bindings]]
name = "RL_AUTH"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "RL_ADMIN"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

# Import admin.html as a string.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[observability]
enabled = true
