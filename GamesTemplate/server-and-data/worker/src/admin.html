<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Too Soon Games · אדמין</title>
<style>
:root{--bg:#140b24;--surface:#221440;--ink:#fff;--muted:#b9a9d9;--magenta:#ff4fd8;--violet:#8a3cff;--accent:#ffc400;--ok:#3ddc84;--bad:#ff5c7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Rubik,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #2e1f52}
header h1{font-size:18px;margin:0;background:linear-gradient(135deg,var(--magenta),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
header .sp{flex:1}
select,input,button{font:inherit;border-radius:999px;border:1px solid #3a2a66;background:#1b1036;color:var(--ink);padding:8px 14px}
button{cursor:pointer;background:var(--accent);color:#1a1200;border:0;font-weight:700}
button.ghost{background:transparent;border:1px solid #3a2a66;color:var(--muted)}
button.danger{background:var(--bad);color:#fff}
main{padding:16px;max-width:1200px;margin:0 auto;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
section{background:var(--surface);border-radius:20px;padding:16px;min-width:0}
section.wide{grid-column:1/-1}
h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{background:#1b1036;border-radius:14px;padding:12px}
.tile b{display:block;font-size:26px;line-height:1.1}
.tile span{color:var(--muted);font-size:12px}
.funnel div{display:grid;grid-template-columns:130px 1fr 60px 52px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--magenta),var(--violet))}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:6px 4px;border-bottom:1px solid #2e1f52;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
th{color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.err{color:var(--bad);font-size:13px;white-space:pre-wrap}
svg{width:100%;height:120px;display:block}
#login{max-width:360px;margin:80px auto;background:var(--surface);padding:24px;border-radius:20px;text-align:center}
#login input{width:100%;margin:12px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="login">
  <h1 style="margin:0 0 6px">Too Soon Games</h1>
  <div class="muted">מסך הדאטה. הזן את מפתח האדמין.</div>
  <input id="key" type="password" placeholder="מפתח אדמין" autocomplete="current-password">
  <button id="go">כניסה</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="app" hidden>
<header>
  <h1>Too Soon Games · דאטה</h1>
  <select id="game"></select>
  <select id="days"><option value="1">24 שעות</option><option value="7" selected>7 ימים</option><option value="30">30 יום</option><option value="90">90 יום</option></select>
  <button id="refresh" class="ghost">רענן</button>
  <span class="sp"></span>
  <button id="newGame" class="ghost">+ משחק</button>
  <button id="logout" class="ghost">יציאה</button>
</header>
<main>
  <section class="wide"><h2>סיכום</h2><div class="tiles" id="tiles"></div></section>
  <section><h2>משפך <span class="muted" id="funnelNote"></span></h2><div class="funnel" id="funnel"></div></section>
  <section><h2>ביקורים ליום</h2><svg id="daily" viewBox="0 0 600 120" preserveAspectRatio="none"></svg><div class="muted" id="dailyNote" style="font-size:12px"></div></section>
  <section><h2>מדינות</h2><table id="countries"></table></section>
  <section><h2>ערים</h2><table id="cities"></table></section>
  <section><h2>מכשירים</h2><table id="devices"></table></section>
  <section><h2>שיתוף לפי ערוץ</h2><table id="share"></table></section>
  <section><h2>הפסדים לפי שלב</h2><table id="over"></table></section>
  <section><h2>הפניות (מי הביא חברים)</h2><table id="referrals"></table></section>
  <section><h2>עקבו אחרינו</h2><table id="follows"></table></section>
  <section class="wide"><h2>שגיאות אחרונות</h2><table id="errors"></table></section>
  <section class="wide"><h2>לידרבורד <span class="muted">(מחיקה = טרול, בלי אישור נוסף)</span></h2><table id="board"></table></section>
  <section class="wide"><h2>כל האירועים בטווח</h2><table id="counts"></table></section>
</main>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const KEY='tsg_admin_key';
let key=null;try{key=sessionStorage.getItem(KEY);}catch{}
const api=async(path,opt={})=>{
  const r=await fetch(path,{...opt,headers:{'content-type':'application/json','x-admin-key':key||'',...(opt.headers||{})}});
  if(r.status===401){logout('מפתח שגוי');throw new Error('unauthorized');}
  if(!r.ok){let m=r.status+'';try{m=(await r.json()).message||m;}catch{}throw new Error(m);}
  return r.status===204?null:r.json();
};
function logout(msg){key=null;try{sessionStorage.removeItem(KEY);}catch{}$('#app').hidden=true;$('#login').hidden=false;$('#loginErr').textContent=msg||'';}
async function login(k){key=k;try{await api('/v1/admin/games');}catch(e){return;}try{sessionStorage.setItem(KEY,k);}catch{}$('#login').hidden=true;$('#app').hidden=false;await loadGames();}
$('#go').onclick=()=>login($('#key').value.trim());
$('#key').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click();});
$('#logout').onclick=()=>logout('');
$('#refresh').onclick=()=>load();
$('#game').onchange=()=>load();$('#days').onchange=()=>load();
$('#newGame').onclick=async()=>{
  const id=prompt('מזהה המשחק (slug, אותיות קטנות ומקפים, לא משתנה אחרי פרסום):');if(!id)return;
  const name=prompt('שם תצוגה:',id);if(!name)return;
  const maxScore=Number(prompt('ניקוד מקסימלי אפשרי (ניקוד גבוה יותר נדחה):','100000'));
  const minDurationS=Number(prompt('זמן משחק מינימלי בשניות (0 = בלי בדיקה):','5'));
  try{await api('/v1/admin/games/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({name,maxScore,minDurationS})});await loadGames(id);}catch(e){alert(e.message);}
};
async function loadGames(select){
  const {games}=await api('/v1/admin/games');
  const sel=$('#game');sel.innerHTML='';
  for(const g of games){const o=document.createElement('option');o.value=g.game_id;o.textContent=`${g.name} (${g.game_id}) · ${g.players} שחקנים`;sel.appendChild(o);}
  if(select)sel.value=select;
  if(!games.length){$('#tiles').innerHTML='<div class="muted">אין משחקים עדיין. לחץ "+ משחק" או פרסם משחק עם /publish-game.</div>';return;}
  await load();
}
const fmt=n=>Number(n||0).toLocaleString('en-US');
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'';
function table(sel,rows,cols,render){
  const t=$(sel);if(!rows||!rows.length){t.innerHTML='<tr><td class="muted">אין נתונים</td></tr>';return;}
  t.innerHTML='<tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+render(r).map(v=>`<td>${v}</td>`).join('')+'</tr>').join('');
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
  const game=$('#game').value;const days=$('#days').value;if(!game)return;
  const [s,b]=await Promise.all([api(`/v1/admin/games/${game}/stats?days=${days}`),api(`/v1/admin/games/${game}/board?limit=50`)]);
  const ae=s.ae,aeOk=!ae.error;
  const c=aeOk?ae.counts:{};
  $('#tiles').innerHTML=[
    ['שחקנים (סה"כ)',fmt(s.d1.players)],['שחקנים חדשים בטווח',fmt(s.d1.playersInRange)],['בלוח',fmt(s.d1.scores)],
    ['שיא',s.d1.bestScore==null?'-':fmt(s.d1.bestScore)],['ממוצע',s.d1.avgScore==null?'-':fmt(s.d1.avgScore)],
    ['ביקורים',aeOk?fmt(c.session_start):'-'],['סיימו',aeOk?fmt(c.game_complete):'-'],['לחצו שיתוף',aeOk?fmt(c.share_click):'-'],['הגיעו משיתוף',aeOk?fmt(c.referral_start):'-'],
  ].map(([l,v])=>`<div class="tile"><b>${v}</b><span>${l}</span></div>`).join('');
  if(!aeOk){
    const msg=`<div class="err">אנליטיקה לא זמינה: ${esc(ae.error)}\n(מקומית זה צפוי. בענן: הגדר CF_ACCOUNT_ID ו־CF_API_TOKEN.)</div>`;
    for(const id of ['funnel','countries','cities','devices','share','over','referrals','follows','errors','counts'])$('#'+id).innerHTML=msg;
    $('#daily').innerHTML='';$('#dailyNote').textContent='';
  }else{
    const f=ae.funnel,max=f[0].n||1;
    $('#funnelNote').textContent=ae.uniques?`· ${fmt(ae.uniques.users)} משתמשים ייחודיים, ${fmt(ae.uniques.sessions)} ביקורים`:'';
    $('#funnel').innerHTML=f.map((x,i)=>`<div><span>${{session_start:'הגיעו',game_start:'התחילו',game_complete:'סיימו',share_click:'לחצו שיתוף',referral_start:'הגיעו משיתוף'}[x.name]}</span><div class="bar" style="width:${Math.max(2,x.n/max*100)}%"></div><b>${fmt(x.n)}</b><span class="muted">${i?pct(x.n,f[i-1].n):''}</span></div>`).join('');
    const d=ae.daily||[],m=Math.max(1,...d.map(x=>+x.n)),w=600/Math.max(1,d.length);
    $('#daily').innerHTML=d.map((x,i)=>`<rect x="${i*w+1}" y="${120-(+x.n/m*110)}" width="${Math.max(1,w-2)}" height="${+x.n/m*110}" fill="url(#g)"><title>${x.day}: ${fmt(x.n)}</title></rect>`).join('')+'<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4fd8"/><stop offset="1" stop-color="#8a3cff"/></linearGradient></defs>';
    $('#dailyNote').textContent=d.length?`${d[0].day.slice(0,10)} → ${d[d.length-1].day.slice(0,10)}, שיא ${fmt(m)} ביום`:'אין נתונים';
    table('#countries',ae.countries,['מדינה','ביקורים'],r=>[esc(r.country||'?'),fmt(r.n)]);
    table('#cities',ae.cities,['עיר','מדינה','ביקורים'],r=>[esc(r.city||'?'),esc(r.country||''),fmt(r.n)]);
    table('#devices',ae.devices,['מכשיר','ביקורים'],r=>[esc(r.device),fmt(r.n)]);
    table('#share',ae.share,['אירוע','ערוץ','כמות'],r=>[esc(r.name),esc(r.channel||'?'),fmt(r.n)]);
    table('#over',ae.overByStage,['שלב','הפסדים','זמן ממוצע (ש׳)'],r=>[esc(r.stage||'?'),fmt(r.n),Math.round(r.avgTime||0)]);
    table('#referrals',ae.referrals,['משתף (userId קצר)','פתיחות'],r=>[esc(r.fromUser||'?'),fmt(r.n)]);
    table('#follows',ae.follows,['רשת','לחיצות'],r=>[esc(r.network||'?'),fmt(r.n)]);
    table('#errors',ae.errors,['זמן','מכשיר','פרטים'],r=>[esc(String(r.timestamp).slice(0,19)),esc(r.device),`<span title="${esc(r.props)}">${esc(String(r.props).slice(0,120))}</span>`]);
    table('#counts',Object.entries(c).sort((a,b)=>b[1]-a[1]),['אירוע','כמות'],([k,v])=>[esc(k),fmt(v)]);
  }
  table('#board',b.rows,['#','כינוי','ניקוד','זמן','שלב','גרסה','מדינה','עודכן',''],(r)=>{
    const i=b.rows.indexOf(r)+1;
    return [i,esc(r.nick||'אנונימי'),fmt(r.score),r.duration_s??'',esc(r.stage||''),esc(r.version||''),esc(r.country||''),esc(String(r.updated_at).slice(0,16)),`<button class="danger" data-del="${r.user_id}" style="padding:4px 10px;font-size:12px">מחק</button>`];
  });
  $('#board').onclick=async e=>{const id=e.target&&e.target.getAttribute('data-del');if(!id)return;try{await api(`/v1/admin/games/${game}/scores/${id}`,{method:'DELETE'});await load();}catch(err){alert(err.message);}};
}
if(key)login(key);
})();
</script>
</body>
</html>
