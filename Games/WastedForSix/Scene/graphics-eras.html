    e.set(-Math.PI/2,0,Math.PI/2);q.setFromEuler(e);m4.compose(new THREE.Vector3(t,.02,r),q,new THREE.Vector3(1,1,1));lines.setMatrixAt(li++,m4);
  }}

function windowTex(seed){

  g.fillStyle='#e4ddd2';g.fillRect(0,0,128,256);

  for(let y=6;y<256;y+=12)for(let x=6;x<128;x+=14){

}
const tex=windowTex();
const bodyCols=[0xf2d8b0,0xe8b8a0,0xc8dcd0,0xf0e6d0,0xd8c8e0,0xe8d090,0xb8c8d8,0xe0a888];
const blocks=[],buildings=[],parks=[];
const neonCols=[0xff2fd0,0x2ff3ff,0xff8a2f,0x9b4dff,0x3dff8a];
// static geometry buckets -> merged into one mesh per material
const buckets=new Map();
const tmpCol=new THREE.Color();
function addStatic(key,geo,matrix,color){
  geo=geo.index?geo.toNonIndexed():geo;geo.applyMatrix4(matrix);
  for(const k of Object.keys(geo.attributes))if(!['position','normal','uv'].includes(k))geo.deleteAttribute(k);
  if(!geo.attributes.uv)geo.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(geo.attributes.position.count*2),2));
  const n=geo.attributes.position.count,c=new Float32Array(n*3);tmpCol.set(color??0xffffff);
  for(let i=0;i<n;i++){c[i*3]=tmpCol.r;c[i*3+1]=tmpCol.g;c[i*3+2]=tmpCol.b;}
  geo.setAttribute('color',new THREE.BufferAttribute(c,3));
  if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(geo);

const M=(x,y,z,ry=0,rx=0)=>new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,0,'YXZ')),new THREE.Vector3(1,1,1));
const MATS={
  bldg:{mat:new THREE.MeshStandardMaterial({vertexColors:true,map:tex,roughness:.85,metalness:0}),cast:true,recv:true},
  plain:{mat:new THREE.MeshStandardMaterial({vertexColors:true,roughness:.8}),cast:false,recv:true},
  tree:{mat:new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:.9}),cast:true,recv:false},
  neon:{mat:new THREE.MeshBasicMaterial({vertexColors:true}),cast:false,recv:false},
  sign:{mat:new THREE.MeshBasicMaterial({vertexColors:true}),cast:false,recv:false},

// ================= CITY GENERATOR: districts =================
const R=Math.random,pick=a=>a[(R()*a.length)|0];
const grounds=[];
// ---------- ROAD NETWORK EXTRAS: curves, diagonal, roundabouts ----------
const paths=[];   // each: {pts:[{x,z}], hw}
function blocked(x,z,r){
  for(const p of paths)for(const q of p.pts)if((q.x-x)**2+(q.z-z)**2<(r+p.hw+2)**2)return true;
  for(const o of ISLANDS)if(Math.hypot(o.x-x,o.z-z)<o.r+r+8)return true;
  return false;
}
function ribbon(pts,w,y,col){
  const pos=[],idx=[];
  for(let k=0;k<pts.length;k++){
    const a=pts[Math.max(0,k-1)],b=pts[Math.min(pts.length-1,k+1)];
    let dx=b.x-a.x,dz=b.z-a.z;const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;
    pos.push(pts[k].x-dz*w/2,y,pts[k].z+dx*w/2, pts[k].x+dz*w/2,y,pts[k].z-dx*w/2);
    if(k)idx.push(2*k-2,2*k-1,2*k, 2*k-1,2*k+1,2*k);
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);
  g.computeVertexNormals();
  if(g.attributes.normal.getY(0)<0){idx.reverse?0:0;for(let k=0;k<idx.length;k+=3){const t=idx[k];idx[k]=idx[k+1];idx[k+1]=t;}g.setIndex(idx);g.computeVertexNormals();}
  addStatic('plain',g,new THREE.Matrix4(),col);
}
function road(ctrl,w=ROAD){
  const c=new THREE.CatmullRomCurve3(ctrl.map(p=>new THREE.Vector3(p[0],0,p[1])));
  const L=c.getLength(),n=Math.ceil(L/2);
  const pts=c.getSpacedPoints(n).map(v=>({x:v.x,z:v.z}));
  paths.push({pts,hw:w/2});
  ribbon(pts,w,.22,0x55565c);            // asphalt
  for(let k=2;k<pts.length-2;k+=4){      // dashed centre line
    const a=pts[k],b=pts[k+1];
    addStatic('neon',new THREE.BoxGeometry(.4,.05,1.8),M(a.x,.25,a.z,Math.atan2(b.x-a.x,b.z-a.z)),0xf2d15a);
  }
}
const ISLANDS=[{x:84,z:-140,r:7},{x:-28,z:196,r:7},{x:196,z:-140,r:7},{x:-196,z:-196,r:7}];
function groundRect(x,z,w,d,col,y=.08){addStatic('plain',new THREE.BoxGeometry(w,.16,d),M(x,y,z),col);grounds.push({x,z,w,d,c:col});}
function solid(x,z,hw,hd,col){buildings.push({x,z,hw,hd,c:col});}
function winUV(g,w,d,h,cyl){
  const uv=g.attributes.uv,ox=R(),oy=R();
  if(cyl){const side=(g.parameters.radialSegments+1)*(g.parameters.heightSegments+1);
    for(let v=0;v<uv.count;v++){if(v>=side){uv.setXY(v,.01,.01);continue;}uv.setXY(v,uv.getX(v)*w/10+ox,uv.getY(v)*h/20+oy);}return;}
  for(let v=0;v<uv.count;v++){const f=Math.floor(v/4);
    if(f===2||f===3){uv.setXY(v,.01,.01);continue;}
    uv.setXY(v,uv.getX(v)*(f<2?d:w)/10+ox,uv.getY(v)*h/20+oy);}
}
function roofJunk(x,z,w,d,y,n){for(let r=0;r<n;r++)addStatic('plain',new THREE.BoxGeometry(1.5+R()*3,1,1.5+R()*3),M(x+(R()-.5)*(w-5),y+.5,z+(R()-.5)*(d-5)),pick([0x8a8a96,0x5a5a66,0xb0a890]));}
function box(x,z,w,d,h,col,y0=.4,collide=true){
  if(collide&&blocked(x,z,Math.min(w,d)/2))return;
  const g=new THREE.BoxGeometry(w,h,d);winUV(g,w,d,h);
  addStatic('bldg',g,M(x,y0+h/2,z),col);
  if(collide)solid(x,z,w/2,d/2,col);
}
function tower(x,z,w,d,h,col){
  if(blocked(x,z,Math.max(w,d)/2))return;
  box(x,z,w,d,h,col);roofJunk(x,z,w,d,h+.4,2+R()*3);
  if(h>9&&R()<.75)addStatic('sign',new THREE.BoxGeometry(w+.5,.6,d+.5),M(x,.4+h*(.3+R()*.55),z),pick(neonCols));
  if(R()<.5)addStatic('neon',new THREE.BoxGeometry(w+.3,.35,d+.3),M(x,h+.4,z),0xf8f4ec);
  if(R()<.18&&w>12&&d>12)addStatic('neon',new THREE.BoxGeometry(w*.4,.15,d*.3),M(x,h+.5,z),0x3ab8e0);
  else if(R()<.15)addStatic('neon',new THREE.CylinderGeometry(Math.min(w,d)*.3,Math.min(w,d)*.3,.2,16),M(x,h+.5,z),0xffd23d);
}
function stepped(x,z,w,d,h,col){
  if(blocked(x,z,Math.max(w,d)/2))return;
  let y=.4;
  for(let k=0;k<3;k++){const hh=h*(k===0?.5:.25);const ww=w*(1-k*.25),dd=d*(1-k*.25);
    box(x,z,ww,dd,hh,col,y,k===0);addStatic('neon',new THREE.BoxGeometry(ww+.3,.35,dd+.3),M(x,y+hh,z),0xf8f4ec);y+=hh;}
  addStatic('neon',new THREE.CylinderGeometry(.15,.15,8,4),M(x,y+4,z),0xd02a2a);
}
function round(x,z,r,h,col){
  if(blocked(x,z,r))return;
  const g=new THREE.CylinderGeometry(r,r,h,20,1);winUV(g,Math.PI*2*r,0,h,true);
  addStatic('bldg',g,M(x,.4+h/2,z),col);solid(x,z,r*.9,r*.9,col);
  addStatic('neon',new THREE.CylinderGeometry(r*.6,r*.6,.2,20),M(x,h+.5,z),0xffd23d);
  addStatic('neon',new THREE.CylinderGeometry(r+.2,r+.2,.35,20,1,true),M(x,h+.4,z),0xf8f4ec);
}
function lshape(x,z,s,h,col){
  if(blocked(x,z,s/2))return;
  const t=s*.45,sx=R()<.5?1:-1,sz=R()<.5?1:-1;
  box(x,z+sz*(s-t)/2,s,t,h,col);
  box(x+sx*(s-t)/2,z-sz*t/2,t,s-t,h,col);

  if(R()<.6)addStatic('plain',new THREE.BoxGeometry(s*.5,.3,s*.5),M(x-sx*s*.22,.3,z-sz*s*.22),0x6a9a42);

function house(x,z,w,d){
  if(blocked(x,z,Math.max(w,d)/2))return;
  const wall=pick([0xf4ece0,0xe8d8b8,0xd8e4ec,0xf0d8c8,0xe0e8d0]),roof=pick([0xb8502e,0x9a4030,0x5a6a7a,0x7a5040,0xc86a3a]);

// winding road through the west hills (suburbs)
road([[-308,-150],[-310,-120],[-334,-92],[-326,-58],[-290,-40],[-284,-10],[-326,14],[-336,44],[-308,70],[-308,94]]);
road([[-290,-40],[-270,-30],[-245,-28]]);
// ring road (north) - oval loop joined to the grid on both sides
{const cx=56,cz=-252,rx=52,rz=28,pts=[];
 for(let k=0;k<=24;k++){const a=k/24*Math.PI*2;pts.push([cx+Math.cos(a)*rx,cz+Math.sin(a)*rz]);}
 road(pts,ROAD-2);

}

function makeCar(bodyColor,police=false){
  const g=new THREE.Group();
  const paint=new THREE.MeshPhysicalMaterial({color:bodyColor,metalness:.6,roughness:.25,clearcoat:1,clearcoatRoughness:.05});
  const dark=new THREE.MeshStandardMaterial({color:0x0a0a0f,roughness:.2,metalness:.8});
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.1,.7,4.6),paint);body.position.y=.75;body.castShadow=true;g.add(body);
  const nose=new THREE.Mesh(new THREE.BoxGeometry(2.0,.35,1.2),paint);nose.position.set(0,1.2,-1.6);g.add(nose);
  const cab=new THREE.Mesh(new THREE.BoxGeometry(1.8,.6,2.0),dark);cab.position.set(0,1.38,.2);cab.castShadow=true;g.add(cab);
  const spoiler=new THREE.Mesh(new THREE.BoxGeometry(2.1,.1,.5),paint);spoiler.position.set(0,1.45,2.15);g.add(spoiler);
  const wg=new THREE.CylinderGeometry(.42,.42,.35,16);wg.rotateZ(Math.PI/2);
  const wm=new THREE.MeshStandardMaterial({color:0x111111,roughness:.9});
  g.wheels=[];
  for(const [x,z] of [[-1.05,-1.5],[1.05,-1.5],[-1.05,1.5],[1.05,1.5]]){const w=new THREE.Mesh(wg,wm);w.position.set(x,.42,z);g.add(w);g.wheels.push(w);}
  const hl=new THREE.MeshBasicMaterial({color:0xfff6d8});
  for(const x of[-.7,.7]){const h=new THREE.Mesh(new THREE.BoxGeometry(.5,.18,.05),hl);h.position.set(x,.85,-2.31);g.add(h);}
  const tl=new THREE.MeshBasicMaterial({color:0xff1a3a});
  const t=new THREE.Mesh(new THREE.BoxGeometry(1.9,.14,.05),tl);t.position.set(0,.9,2.31);g.add(t);
  // underglow
  const ug=new THREE.Mesh(new THREE.PlaneGeometry(2.6,5.2),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.3,depthWrite:false}));
  ug.rotation.x=-Math.PI/2;ug.position.y=.05;g.add(ug);
  if(police){
    g.red=new THREE.MeshBasicMaterial({color:0xff0020});g.blue=new THREE.MeshBasicMaterial({color:0x0030ff});
    const r=new THREE.Mesh(new THREE.BoxGeometry(.7,.2,.35),g.red);r.position.set(-.45,1.78,.2);
    const b=new THREE.Mesh(new THREE.BoxGeometry(.7,.2,.35),g.blue);b.position.set(.45,1.78,.2);g.add(r,b);
    const stripe=new THREE.Mesh(new THREE.BoxGeometry(2.12,.25,2.4),new THREE.MeshStandardMaterial({color:0xffffff}));stripe.position.set(0,.75,.3);g.add(stripe);
  }else{
    
  }
  return g;
}

if(!EMBED){const bs=document.getElementById('btns');for(let n=1;n<=4;n++){const b=document.createElement('button');b.textContent=n;b.dataset.n=n;b.onclick=()=>setEra(n,true);bs.append(b);}
  addEventListener('keydown',e=>{const n=+e.key;if(n>=1&&n<=4)setEra(n,true);});}
else stage.onclick=()=>window.open(location.pathname+'?era='+eraN);
setEra(eraN,false);
addEventListener('resize',size);

const camPos=new THREE.Vector3(),camLook=new THREE.Vector3();
function frame(){
  const now=Date.now()/1000,u=now*SPEED/ROUTE_L;
  const {p,t}=ride(player,u);ride(cop,u-17/ROUTE_L);
  for(const w of player.wheels)w.rotation.x=-now*SPEED/.42;
  const f=Math.floor(now*8)%2;cop.red.color.setHex(f?0xff0020:0x220004);cop.blue.color.setHex(f?0x000820:0x0030ff);
  if(E.cam==='chase'){
    camPos.set(p.x-t.x*E.back,E.hgt,p.z-t.z*E.back);
    if(snap)camera.position.copy(camPos);else camera.position.lerp(camPos,.12);
    camLook.set(p.x+t.x*6,1.5,p.z+t.z*6);
  }else{
    camPos.set(p.x+t.x*SPEED*.35,E.zoom,p.z+t.z*SPEED*.35+E.zoom*E.tilt);
    if(snap)camera.position.copy(camPos);else camera.position.lerp(camPos,.08);
    camLook.set(camera.position.x,0,camera.position.z-E.zoom*E.tilt-.001);
  }
  snap=false;camera.lookAt(camLook);
  sunL.position.set(p.x+sunOff.x,sunOff.y,p.z+sunOff.z);sunL.target.position.set(p.x,0,p.z);
  sky.position.copy(camera.position);
  composer.render();requestAnimationFrame(frame);
}
frame();
}
</script>
