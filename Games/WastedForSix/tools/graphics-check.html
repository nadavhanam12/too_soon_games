<!doctype html><meta charset="utf-8"><title>Nice City integration checks</title><style>html{height:100%}body{height:100vh;display:flex;flex-direction:column;margin:0;background:#16212c;color:#eef;font:13px monospace}nav{flex-shrink:0;padding:8px;display:flex;gap:6px;flex-wrap:wrap}button{padding:9px}iframe{width:100%;flex:1;min-height:0;border:0}pre{font-size:11px;flex-shrink:0;max-height:64px;overflow:auto;margin:4px;white-space:pre-wrap}a{color:#8de}</style><nav><button id="start">Start game</button><button id="launch">Launch / Look 3</button><button id="home">Home / Look 4</button><button id="l2">Look 2</button><button id="l3">Look 3</button><button id="l4">Look 4</button><button id="warp">Arrive at goal</button><button id="step">Advance 0.3s</button><button id="walk">Walk sample</button><button id="steer">Steering sample</button><button id="beam">Evening searchlight</button><button id="pause">Pause</button><button id="resume">Resume</button><button id="clean">Hide test UI</button></nav><pre id="status">Loading...</pre><iframe id="game" src="nice-city/"></iframe><script>
const game=document.getElementById('game'), status=document.getElementById('status');
const w=()=>game.contentWindow;
start.onclick=()=>{w().__go('play')};
launch.onclick=()=>{if(w().__state().scene!=='play')w().__go('play');w().__manual(false);w().__stage('launch','sick');w().__manual(true);w().__advance(.8);};
home.onclick=()=>{if(w().__state().scene!=='play')w().__go('play');w().__manual(false);w().__stage('home','sick','ring');w().__manual(true);w().__advance(.8);};
l2.onclick=()=>w().__look(2);l3.onclick=()=>w().__look(3);l4.onclick=()=>w().__look(4);
warp.onclick=()=>w().__warp();step.onclick=()=>w().__advance(.3);
walk.onclick=()=>{w().__manual(true);w().dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',code:'Enter',bubbles:true}));w().__advance(3.2);w().dispatchEvent(new KeyboardEvent('keyup',{key:'Enter',code:'Enter',bubbles:true}));w().__warp();w().__advance(1.2);};steer.onclick=()=>{w().__manual(true);for(const key of ['Enter','ArrowUp','ArrowRight'])w().dispatchEvent(new KeyboardEvent('keydown',{key,code:key,bubbles:true}));w().__advance(1.2);for(const key of ['Enter','ArrowUp','ArrowRight'])w().dispatchEvent(new KeyboardEvent('keyup',{key,code:key,bubbles:true}));};
let beamCapture=false;beam.onclick=()=>{const first=!beamCapture;beamCapture=true;w().dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',code:'Enter',bubbles:true}));w().__advance(first?4:.1);w().dispatchEvent(new KeyboardEvent('keyup',{key:'Enter',code:'Enter',bubbles:true}));w().__heliPreview();w().__look(4);w().__advance(.05);};pause.onclick=()=>w().__manual(true);resume.onclick=()=>w().__manual(false);
clean.onclick=()=>{document.querySelector('nav').style.visibility='hidden';status.style.visibility='hidden';w().__manual(true);setTimeout(()=>{w().__advance(1.5);if(beamCapture){w().__heliPreview();w().__advance(.02);}},180);};
let ticks=[],last=performance.now();function tick(t){if(t-last<150)ticks.push(t-last);if(ticks.length>180)ticks.shift();last=t;requestAnimationFrame(tick)}requestAnimationFrame(tick);
setInterval(()=>{try{const graphics=w().__graphics?.(),world=w().__world?.();status.textContent=JSON.stringify({graphics,world,outerFrameAvg:+(ticks.reduce((a,b)=>a+b,0)/ticks.length).toFixed(1)});}catch(e){status.textContent=e.message}},250);
</script>
