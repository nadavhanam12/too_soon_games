<script>
(()=>{
// ---------- publish config ----------
// PUBLIC_URL: the public game page (itch.io). Empty = location.href. Keep equal to itch.json pageUrl once published.
const PUBLIC_URL='https://hanam.itch.io/chip-drop';
const WA_ME='';
const WA_GROUP='https://chat.whatsapp.com/IS2YOSN4tLSByqjF0z9e86?mode=gi_t';
const W=360,H=640;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1;
function fit(){const dpr=Math.min(window.devicePixelRatio||1,2);scale=Math.min(window.innerWidth/W,window.innerHeight/H);cv.style.width=(W*scale)+'px';cv.style.height=(H*scale)+'px';cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener('resize',()=>{fit();if(!shareEl.hidden)placeShare();});fit();

// ---------- helpers ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const HF="'Patrick Hand','Rubik',system-ui,Arial";
function font(sz,w=700){ctx.font=`${w} ${sz}px ${HF}`;}
function txt(s,x,y,sz=16,col=INK,al='center',w=700){font(sz,w);ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline='middle';ctx.direction='ltr';ctx.fillText(s,x,y);}
function wrap(s,sz,maxW){font(sz,700);const words=s.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}
function inBtn(p,x,y,w,h){return Math.abs(p.x-x)<w/2&&Math.abs(p.y-y)<h/2;}

// ---------- hand-drawn kit ----------
// Every stroke is jittered by a hash of (point index, inkSeed); inkSeed advances a few times a second so lines "boil".
let inkSeed=0,inkT=0;
function jit(i,a){const s=Math.sin(i*12.9898+inkSeed*78.233)*43758.5453;return (s-Math.floor(s)-.5)*2*a;}
const INK='#f3f3f3',NV='#76b900';
function ink(pts,w=3,col=INK,close=false,a=1.4){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,i)=>{const x=p[0]+jit(i+p[0]*.13,a),y=p[1]+jit(i*7+p[1]*.11,a);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});if(close)ctx.closePath();ctx.stroke();}
function inkRect(x,y,w,h,lw=3,col=INK){ink([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],lw,col,true);}
function inkCirc(cx,cy,r,lw=3,col=INK){const pts=[];for(let i=0;i<14;i++){const a=i/14*Math.PI*2;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}ink(pts,lw,col,true,r*.08+.4);}
function marker(x,y,w,h,col,al=.85){ctx.globalAlpha=al;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x+jit(1+x,2.5),y+jit(2+y,2.5));ctx.lineTo(x+w+jit(3+x,2.5),y+jit(4+y,2.5));ctx.lineTo(x+w+jit(5+x,2.5),y+h+jit(6+y,2.5));ctx.lineTo(x+jit(7+x,2.5),y+h+jit(8+y,2.5));ctx.closePath();ctx.fill();ctx.globalAlpha=1;}
function markerCirc(cx,cy,r,col,al=.9){ctx.globalAlpha=al;ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(cx+jit(9+cx,1.5),cy+jit(10+cy,1.5),r*1.04,r*.97,.3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
function hatch(x,y,w,h,col='rgba(0,0,0,.18)',gap=7){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.strokeStyle=col;ctx.lineWidth=1.5;for(let i=-h;i<w;i+=gap){ctx.beginPath();ctx.moveTo(x+i,y+h);ctx.lineTo(x+i+h,y);ctx.stroke();}ctx.restore();}
const paperC=document.createElement('canvas');paperC.width=W;paperC.height=H;
{const p=paperC.getContext('2d');p.fillStyle='#161616';p.fillRect(0,0,W,H);for(let i=0;i<2600;i++){p.fillStyle=`rgba(255,255,255,${Math.random()*.09})`;p.fillRect(Math.random()*W,Math.random()*H,1.5,1.5);}
  // faint circuit traces
  p.strokeStyle='rgba(118,185,0,.22)';p.lineWidth=1.5;for(let i=0;i<30;i++){let x=Math.random()*W,y=Math.random()*H;p.beginPath();p.moveTo(x,y);for(let k=0;k<4;k++){if(k%2)y+=rnd(-70,70);else x+=rnd(-70,70);p.lineTo(x,y);}p.stroke();p.fillStyle='rgba(118,185,0,.35)';p.fillRect(x-2,y-2,4,4);}
  // faint server racks
  p.strokeStyle='rgba(255,255,255,.07)';p.lineWidth=2;for(let i=0;i<5;i++){const x=20+i*72,y=40+(i%2)*300;p.strokeRect(x,y,40,120);for(let k=0;k<6;k++){p.beginPath();p.moveTo(x+4,y+10+k*18);p.lineTo(x+36,y+10+k*18);p.stroke();}}}
function paper(){ctx.drawImage(paperC,0,0);}
function hbtn(s,x,y,w,h,col=NV,sz=20){marker(x-w/2+3,y-h/2+4,w,h,'#000',.9);marker(x-w/2,y-h/2,w,h,col,1);inkRect(x-w/2,y-h/2,w,h,3,'#0b0b0b');txt(s,x,y+1,sz,'#0b0b0b','center',700);}
function sticker(s,x,y,sz=14,bg='#fff8e0',rot=-.06){font(sz);const w=ctx.measureText(s).width+22,h=sz+14;ctx.save();ctx.translate(x,y);ctx.rotate(rot);marker(-w/2+2,-h/2+3,w,h,'#000',.8);marker(-w/2,-h/2,w,h,bg,1);inkRect(-w/2,-h/2,w,h,2.5,'#0b0b0b');txt(s,0,1,sz,'#0b0b0b');ctx.restore();}

// ---------- audio (synth only, no files) ----------
let AC=null,MASTER=null,NOISE=null;
function ac(){if(AC)return AC;AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=.8;MASTER.connect(AC.destination);const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NOISE=b;return AC;}
const vary=(v,p=.05)=>v*(1+rnd(-p,p));
function tone(f,d,type='square',g=.06,o={}){try{const c=ac(),t0=c.currentTime,os=c.createOscillator(),v=c.createGain();os.type=type;os.frequency.setValueAtTime(vary(f),t0);if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t0+d);v.gain.setValueAtTime(.0001,t0);v.gain.linearRampToValueAtTime(g,t0+.005);v.gain.exponentialRampToValueAtTime(.0001,t0+d);os.connect(v);v.connect(MASTER);os.start(t0);os.stop(t0+d+.03);}catch(e){}}
function noise(d,g=.1,lp=2000){try{const c=ac(),t0=c.currentTime,s=c.createBufferSource(),v=c.createGain(),f=c.createBiquadFilter();s.buffer=NOISE;s.loop=true;f.type='lowpass';f.frequency.value=lp;v.gain.setValueAtTime(.0001,t0);v.gain.linearRampToValueAtTime(g,t0+.005);v.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f);f.connect(v);v.connect(MASTER);s.start(t0);s.stop(t0+d+.03);}catch(e){}}
const after=(ms,fn)=>setTimeout(fn,ms);
const sfx={
  boing:(k=1)=>{tone(180*k,.18,'triangle',.09,{slide:520*k});noise(.05,.05,900);},
  crack:()=>{noise(.14,.16,1400);tone(140,.12,'sawtooth',.06,{slide:50});},
  flash:()=>{noise(.06,.08,6000);tone(1800,.05,'sine',.03);},
  tick:()=>{tone(900,.04,'square',.03);},
  thud:()=>{noise(.3,.22,300);tone(70,.35,'sine',.18,{slide:30});},
  stamp:()=>{noise(.12,.25,500);tone(110,.2,'square',.1,{slide:60});after(90,()=>noise(.08,.1,2500));},
  sad:()=>{[330,290,250,200].forEach((f,i)=>after(i*170,()=>tone(f,.22,'triangle',.07)));},
  news:()=>{// breaking-news sting: short swoosh, two filtered saw-chord stabs, sub pulse
    try{const c=ac(),t0=c.currentTime;const sw=c.createBufferSource(),sf=c.createBiquadFilter(),sv=c.createGain();sw.buffer=NOISE;sw.loop=true;sf.type='bandpass';sf.Q.value=1.5;sf.frequency.setValueAtTime(600,t0);sf.frequency.exponentialRampToValueAtTime(5000,t0+.1);sv.gain.setValueAtTime(.12,t0);sv.gain.exponentialRampToValueAtTime(.0001,t0+.16);sw.connect(sf);sf.connect(sv);sv.connect(MASTER);sw.start(t0);sw.stop(t0+.2);
    const stab=(t,fs,d,g)=>fs.forEach(f=>[-9,9].forEach(dt=>{const o=c.createOscillator(),fl=c.createBiquadFilter(),v=c.createGain();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;fl.type='lowpass';fl.frequency.setValueAtTime(2600,t);fl.frequency.exponentialRampToValueAtTime(500,t+d);v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(g,t+.008);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(fl);fl.connect(v);v.connect(MASTER);o.start(t);o.stop(t+d+.05);}));
    stab(t0+.08,[220,277,330],.16,.035);stab(t0+.26,[196,247,294],.3,.035);
    const sub=c.createOscillator(),subv=c.createGain();sub.type='sine';sub.frequency.setValueAtTime(55,t0+.26);subv.gain.setValueAtTime(.0001,t0+.26);subv.gain.linearRampToValueAtTime(.2,t0+.27);subv.gain.exponentialRampToValueAtTime(.0001,t0+.6);sub.connect(subv);subv.connect(MASTER);sub.start(t0+.26);sub.stop(t0+.65);}catch(e){}},
  hurt:()=>{tone(260,.2,'sawtooth',.07,{slide:90});},
};
window.addEventListener('pointerdown',()=>{try{ac().resume();}catch(e){}},{once:true});
// logo/keynote-style stingers (synth)
sfx.whoosh=()=>{try{const c=ac(),t0=c.currentTime,s=c.createBufferSource(),f=c.createBiquadFilter(),v=c.createGain();s.buffer=NOISE;s.loop=true;f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(300,t0);f.frequency.exponentialRampToValueAtTime(4000,t0+.22);f.frequency.exponentialRampToValueAtTime(500,t0+.45);v.gain.setValueAtTime(.0001,t0);v.gain.linearRampToValueAtTime(.16,t0+.12);v.gain.exponentialRampToValueAtTime(.0001,t0+.5);s.connect(f);f.connect(v);v.connect(MASTER);s.start(t0);s.stop(t0+.55);}catch(e){}};
sfx.ping=()=>{[880,1320,1760].forEach((f,i)=>after(i*60,()=>tone(f,.9,'sine',.05)));tone(220,1.2,'triangle',.05);};
sfx.riser=(d=1.2)=>{try{const c=ac(),t0=c.currentTime,os=c.createOscillator(),v=c.createGain(),f=c.createBiquadFilter();os.type='sawtooth';os.frequency.setValueAtTime(80,t0);os.frequency.exponentialRampToValueAtTime(640,t0+d);f.type='lowpass';f.frequency.setValueAtTime(300,t0);f.frequency.exponentialRampToValueAtTime(5000,t0+d);v.gain.setValueAtTime(.0001,t0);v.gain.linearRampToValueAtTime(.07,t0+d*.9);v.gain.exponentialRampToValueAtTime(.0001,t0+d+.1);os.connect(f);f.connect(v);v.connect(MASTER);os.start(t0);os.stop(t0+d+.15);}catch(e){}};
sfx.logo=()=>{sfx.whoosh();after(140,sfx.ping);};

// ---------- music (synth loop, keynote-techno, no files) ----------
const MUSIC={on:true,mode:'off',bpm:126,step:0,next:0,timer:null,bus:null,
  // Am  F  C  G   (midi roots) and chord tones
  prog:[[57,[57,60,64,67]],[53,[53,57,60,65]],[48,[48,52,55,60]],[55,[55,59,62,67]]],
  hz:n=>440*Math.pow(2,(n-69)/12),
  set(mode){if(mode===this.mode)return;this.mode=mode;if(mode==='off'){this.stop();return;}this.start();},
  start(){if(this.timer)return;const c=ac();if(!this.bus){this.bus=c.createGain();this.bus.gain.value=.5;this.bus.connect(MASTER);}this.step=0;this.next=c.currentTime+.05;this.timer=setInterval(()=>this.tick(),90);},
  stop(){if(this.timer){clearInterval(this.timer);this.timer=null;}},
  tick(){if(!this.on)return;const c=AC;if(!c||c.state!=='running')return;const sd=60/this.bpm/4;while(this.next<c.currentTime+.25){this.play(this.step,this.next,sd);this.step=(this.step+1)%64;this.next+=sd;}},
  osc(type,f,t0,d,g,o={}){const c=AC,os=c.createOscillator(),v=c.createGain();os.type=type;os.frequency.setValueAtTime(f,t0);if(o.det)os.detune.value=o.det;if(o.slide)os.frequency.exponentialRampToValueAtTime(o.slide,t0+d);let dst=v;if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;os.connect(fl);fl.connect(v);}else os.connect(v);v.gain.setValueAtTime(.0001,t0);v.gain.linearRampToValueAtTime(g,t0+(o.a||.01));v.gain.exponentialRampToValueAtTime(.0001,t0+d);v.connect(this.bus);os.start(t0);os.stop(t0+d+.05);},
  nz(t0,d,g,hp){const c=AC,s=c.createBufferSource(),f=c.createBiquadFilter(),v=c.createGain();s.buffer=NOISE;s.loop=true;f.type='highpass';f.frequency.value=hp;v.gain.setValueAtTime(g,t0);v.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f);f.connect(v);v.connect(this.bus);s.start(t0);s.stop(t0+d+.03);},
  play(i,t,sd){const bar=Math.floor(i/16)%4,s16=i%16,[root,ch]=this.prog[bar],full=this.mode==='play',calm=this.mode==='calm';
    // pad: two detuned saws, one per bar
    if(s16===0){const g=calm?.045:.035;ch.forEach(n=>{this.osc('sawtooth',this.hz(n),t,sd*16,g,{det:-7,lp:900,a:.4});this.osc('sawtooth',this.hz(n),t,sd*16,g,{det:7,lp:900,a:.4});});}
    // arp: 16ths over chord tones, two octaves up
    const an=ch[(s16*5)%4]+(s16%8<4?12:24);this.osc('triangle',this.hz(an),t,sd*1.6,calm?.05:.06,{lp:4000});
    if(!full)return;
    // bass: 8ths on root
    if(s16%2===0)this.osc('sawtooth',this.hz(root-12),t,sd*1.8,.16,{lp:380});
    // kick 4/4, clap 2&4, hats off-8ths
    if(s16%4===0)this.osc('sine',150,t,.22,.5,{slide:38});
    if(s16===4||s16===12)this.nz(t,.12,.18,1500);
    if(s16%4===2)this.nz(t,.05,.08,7000);
  }};
window.addEventListener('keydown',e=>{if(e.key==='m'||e.key==='M'){MUSIC.on=!MUSIC.on;if(MUSIC.bus)MUSIC.bus.gain.value=MUSIC.on?.5:0;}});

// ---------- input ----------
const keys={};let pDown=false,pX=0,pY=0,tapQueue=[],jumpReq=false,movePid=null;
const JB={x:W/2,y:H-46,r:30};const inJump=p=>scene==='play'&&Math.hypot(p.x-JB.x,p.y-JB.y)<JB.r+14;
function toL(e){const r=cv.getBoundingClientRect();const sc=r.width/W||scale||1;return {x:(e.clientX-r.left)/sc,y:(e.clientY-r.top)/sc};}
cv.addEventListener('pointerdown',e=>{const p=toL(e);cv.setPointerCapture(e.pointerId);if(inJump(p)){jumpReq=true;return;}movePid=e.pointerId;pDown=true;pX=p.x;pY=p.y;tapQueue.push(p);});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==movePid)return;const p=toL(e);pX=p.x;pY=p.y;});
const pend=e=>{if(e.pointerId===movePid){pDown=false;movePid=null;}};cv.addEventListener('pointerup',pend);cv.addEventListener('pointercancel',pend);
window.addEventListener('keydown',e=>{if(e.repeat)return;keys[e.key]=true;if([' ','ArrowUp','w','W'].includes(e.key)&&scene==='play'){jumpReq=true;}else if([' ','Enter','ArrowUp','w','W'].includes(e.key)){tapQueue.push({x:W/2,y:H/2,key:true});}if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

const easeO=x=>1-Math.pow(1-x,3),easeOB=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};

// ---------- the CEO ----------
// Origin at the feet. Poses: fall / land / slump. mood 0..3 = grin / neutral / sweat / scream (humor #2: follows market cap).
function ceo(x,y,pose='fall',tm=0,sc=1,mood=0){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  const fl=pose==='fall',sl=pose==='slump',ld=pose==='land';
  if(!sl){const sp=fl?Math.sin(tm*14)*6:0;ink([[-6,-18],[-10+sp,0]],5,'#3a3a48');ink([[6,-18],[10-sp,0]],5,'#3a3a48');markerCirc(-10+sp,1,4,'#444');markerCirc(10-sp,1,4,'#444');}
  else{ink([[-8,-12],[-26,-2]],5,'#3a3a48');ink([[6,-12],[24,-2]],5,'#3a3a48');markerCirc(-27,-1,4,'#444');markerCirc(25,-1,4,'#444');}
  const jy=sl?-32:ld?-36:-42,jh=sl?22:ld?20:26;
  marker(-13,jy,26,jh,'#1d1d22',.96);inkRect(-13,jy,26,jh,2.5,'#cfcfcf');
  ink([[0,jy+2],[0,jy+jh-2]],1.5,'#aaa');ink([[-13,jy],[-5,jy+9]],2,'#999');ink([[13,jy],[5,jy+9]],2,'#999');
  let hl,hr;
  if(fl){const w=Math.sin(tm*10)*8;hl=[-26,jy-14+w];hr=[26,jy-12-w];}
  else if(ld){hl=[-24,jy+18];hr=[24,jy+18];}
  else{hl=[-14,jy+jh+2];hr=[14,jy+jh+2];}
  ink([[-13,jy+4],hl],5.5,'#cfcfcf');ink([[-13,jy+4],hl],3.5,'#1d1d22');ink([[13,jy+4],hr],5.5,'#cfcfcf');ink([[13,jy+4],hr],3.5,'#1d1d22');
  markerCirc(hl[0],hl[1],3.6,'#e8bf98');markerCirc(hr[0],hr[1],3.6,'#e8bf98');
  const hy=jy-12+(sl?6:0);
  markerCirc(0,hy,11,mood>=3?'#f0b0a0':'#e8bf98');inkCirc(0,hy,11,2.5,'#1b1b1b');
  ctx.strokeStyle='#8f8f8f';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();for(let i=0;i<9;i++){const a=Math.PI+i/8*Math.PI;ctx.moveTo(Math.cos(a)*9,hy+Math.sin(a)*9);ctx.lineTo(Math.cos(a)*14+jit(i,1.5),hy+Math.sin(a)*14-2);}ctx.stroke();
  marker(-11,hy-13,22,7,'#9a9a9a',.95);
  const K='#1b1b1b';inkCirc(-5,hy+1,4.2,1.8,K);inkCirc(5,hy+1,4.2,1.8,K);ink([[-1,hy+1],[1,hy+1]],1.5,K);ink([[-9,hy],[-12,hy-1]],1.5,K);ink([[9,hy],[12,hy-1]],1.5,K);
  if(sl){ink([[-4,hy+7],[4,hy+7]],1.5,K);ink([[-10,hy-3],[-6,hy-1]],1.5,K);ink([[10,hy-3],[6,hy-1]],1.5,K);}
  else if(mood>=3){inkCirc(0,hy+7,3.2,1.6,K);ink([[-10,hy-4],[-5,hy-2]],1.5,K);ink([[10,hy-4],[5,hy-2]],1.5,K);for(let i=0;i<3;i++){const d=(tm*3+i*.33)%1;markerCirc(14+i*2,hy-8+d*16,2,'#6ab0e8');}}
  else if(mood===2){ink([[-4,hy+7],[4,hy+7]],1.6,K);markerCirc(13,hy-4+((tm*2)%1)*10,2.2,'#6ab0e8');}
  else if(mood===1)ink([[-4,hy+7],[0,hy+7.5],[4,hy+7]],1.5,K);
  else ink([[-5,hy+5],[0,hy+9],[5,hy+5]],1.6,K);
  ctx.restore();
}

    marker(-6,-32,12,8,'#fff8e0',1);inkRect(-6,-32,12,8,1.5,K);txt('VP',0,-28,7,'#0b0b0b');
    marker(16,-40,8,14,'#111',1);inkRect(16,-40,8,14,1.5,'#cfcfcf');markerCirc(20,-44,2,'#76b900');}

// ---------- play ----------
// World y grows downward. The CEO falls under gravity; landing on a chip bounces him back to about the same height.
// Only special platforms (and a well-timed tap) gain height. The floor (the Nov 12 boardroom) rises slowly and
// accelerates, so the run is minutes long but still ends.
const G=1100,PX=240,START_GAP=1400;
const CHIPS=['H100','B200','GB300','Blackwell','Rubin','H200','A100','Vera'];
const PT={
  chip:{w:[70,104],bounce:-450,label:()=>pick(CHIPS)},
  trump:{w:[96,116],bounce:-820,label:()=>'"honorable guy"'},
  buy:{w:[84,104],bounce:-660,label:()=>'STRONG BUY'},
  sorry:{w:[86,106],bounce:-520,label:()=>'Apology letter'},
  rack:{w:[60,60],bounce:-450,label:()=>'DGX',stairs:true},
  gold:{w:[150,150],bounce:-980,once:true,label:()=>'BOARD: FULL CONFIDENCE'},
  keynote:{w:[96,116],bounce:-620,label:()=>'KEYNOTE'},
  sign:{w:[64,84],bounce:-450,label:()=>pick(['GTC','AI FACTORY','DGX CLOUD','CUDA'])},
  news:{w:[94,126],bounce:0,breaks:true,label:()=>pick(['NYT','WSJ','Bloomberg','The Information'])},
};
const LVL=()=>clamp(PLAYT/150,0,1); // difficulty 0..1 over the first 2.5 minutes
function ptype(){const l=LVL(),r=Math.random();
  // weights drift with difficulty: fewer specials, many more breaking headlines
  const w={chip:lerp(.38,.28,l),trump:lerp(.07,.03,l),buy:lerp(.09,.05,l),sorry:lerp(.12,.10,l),rack:lerp(.08,.05,l),keynote:lerp(.08,.05,l),sign:lerp(.08,.08,l),news:lerp(.10,.36,l)};
  let acc=0;for(const k in w){acc+=w[k];if(r<acc)return k;}return 'news';}
let P=null;
let lastSide=1;
function mk(k,y,x){const d=PT[k],w=rnd(d.w[0],d.w[1])*(k==='gold'?1:lerp(1,.72,LVL()));if(x==null){lastSide=Math.random()<.8?-lastSide:lastSide;x=lastSide<0?rnd(12,W/2-w*.6):rnd(W/2-w*.4,W-12-w);}return {x,y,w,k,label:d.label(),hit:0,gone:0,wob:0};}
function addRow(y){const k=ptype();if(k==='rack'){const x=Math.random()<.5?rnd(12,120):rnd(180,W-72);const dir=x<W/2?1:-1;for(let i=0;i<3;i++)P.plats.push(mk('rack',y-i*52,x+dir*i*44));return;}P.plats.push(mk(k,y));}
function initPlay(){P={x:W/2,y:0,vx:0,vy:0,cam:-H*.42,floor:START_GAP,fs:8,plats:[],parts:[],env:[],top:60,bot:60,pose:'fall',land:0,cap:5,combo:0,sorryN:0,canJump:false,jumpFx:0,npcs:[],agentT:4,vpT:6,inv:0,evt:0,nextGeneric:200,lastQuip:0,quipI:0,planeX:null,magT:0};
  PLAYT=0;P.plats.push(mk('chip',110,W/2-45));P.bot=110;P.top=110;genPlats();}
const gap=()=>{const l=LVL();return rnd(78+16*l,112+30*l);};
function genPlats(){while(P.bot<P.cam+H+260&&P.bot<P.floor-60){P.bot+=gap();addRow(P.bot);}while(P.top>P.cam-320){P.top-=gap();addRow(P.top);}}
function burst(x,y,n,col,sp=160){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(sp*.3,sp);P.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rnd(.4,.8),col,r:rnd(2,5)});}}
const QUIPS=['Still an honorable guy.','The GPUs are fine.','Earnings call still on the 17th.','Beijing denies everything.','Investigation finds nothing. Stock falls anyway.','The jacket stays.','"Deeply sorry." Again.','No evidence of anything. Yet.'];
function landOn(p){const d=PT[p.k];p.hit++;p.wob=1;
  if(d.breaks){p.gone=.01;sfx.crack();burst(P.x,p.y,14,'#c9403a',200);say('"'+p.label+'" breaks the story. And the platform.',1.4,'#f0a0a0');P.combo=0;return;}
  P.vy=d.bounce;P.pose='land';P.land=.14;P.combo++;P.canJump=true;
  if(p.k==='trump'){sfx.boing(1.6);burst(P.x,p.y,10,'#f5d76e');say('"He\'s an honorable guy." Up you go!',1.2,'#f5d76e');}
  else if(p.k==='buy'){sfx.boing(1.4);burst(P.x,p.y,10,'#3d9d55');say('Analyst: STRONG BUY. Big bounce.',1.1,'#9ad7a0');}
  else if(p.k==='sorry'){sfx.boing(.9);flash=.5;sfx.flash();burst(P.x,p.y-20,12,'#fff',240);const att=P.npcs.filter(n=>n.on);if(att.length){att.forEach(n=>{n.on=false;n.vx=n.side*160;n.y=P.y;});say('"I am deeply sorry." She leaves. For now.',1.6,'#fff8e0');}P.sorryN++;if(P.sorryN>=3){P.sorryN=0;const g=mk('gold',P.y-150,clamp(P.x-75,10,W-160));P.plats.push(g);sfx.news();say('Three apologies. The board has FULL CONFIDENCE. Go!',1.8,'#ffd84a');}else say('"I am deeply sorry." Apology '+P.sorryN+'/3.',1.3,'#fff8e0');}
  else if(p.k==='gold'){sfx.boing(1.9);burst(P.x,p.y,18,'#ffd84a',260);p.gone=.01;say('Full confidence lasts one bounce.',1.3,'#ffd84a');}
  else if(p.k==='keynote'){sfx.boing(1.3);burst(P.x,p.y,8,'#76b900');say('Keynote applause. Up!',1,'#76b900');}
  else{sfx.boing(1);if(PLAYT-P.lastQuip>7){P.lastQuip=PLAYT;say(QUIPS[P.quipI++%QUIPS.length],1.6);}}
}
// Story beats by survival time (seconds)
const EVENTS=[
  [20,'MEMO LEAKED: CEO admits affair in letter to staff',()=>{P.planeX=-40;flash=.4;sfx.flash();}],
  [45,'BOARD OPENS INDEPENDENT INVESTIGATION',()=>{}],
  [75,'SECOND AFFAIR REPORTED. BOARD "PREPARING TO OUST"',()=>{P.floor-=160;shake=.5;sfx.thud();}],
  [110,'SENATORS DEMAND RECORDS BE PRESERVED',()=>{P.envT=14;}],
  [150,'ANALYST DOWNGRADE: "THE WRITING IS ON THE WALL"',()=>{P.fsBonus=(P.fsBonus||0)+10;}],
];
const GENERIC=['BEIJING: "HE IS NOT A SPY"','EARNINGS CALL STILL SCHEDULED','STOCK REBOUNDS. BRIEFLY.','BOARD HIRES OUTSIDE SEARCH FIRM','"NO COMPANY SECRETS COMPROMISED"'];
function stepPlay(dt){
  PLAYT+=dt;
  if(jumpReq){jumpReq=false;if(P.canJump){P.canJump=false;P.vy=Math.min(P.vy,0)-520;P.jumpFx=.25;sfx.boing(1.25);burst(P.x,P.y,6,'#f3f3f3',120);}}
  if(P.jumpFx>0)P.jumpFx-=dt;
  if(P.inv>0)P.inv-=dt;
  // affairs: the Agent crosses after the memo leaks (0:20), the VP after the second report (1:15)
  // Mechanic C: touching one is a 'date' (huge jump), but she then sticks to you. Every 10 s together = a
  // headline that raises the floor. Landing on an Apology letter sends her away.
  const has=k=>P.npcs.some(n=>n.k===k);
  if(PLAYT>=20&&!has('agent')){P.agentT-=dt;if(P.agentT<=0){P.agentT=rnd(9,14);const dir=Math.random()<.5?1:-1;P.npcs.push({k:'agent',x:dir>0?-40:W+40,y:P.y+rnd(-220,120),vx:dir*rnd(90,130),t:0,on:false,timer:0,side:dir});}}
  if(PLAYT>=75&&!has('vp')){P.vpT-=dt;if(P.vpT<=0){P.vpT=rnd(11,16);const dir=Math.random()<.5?1:-1;P.npcs.push({k:'vp',x:dir>0?-40:W+40,y:P.y+rnd(-260,80),vx:dir*rnd(55,85),t:0,on:false,timer:0,side:dir});}}
  for(const n of P.npcs){n.t+=dt;
    if(n.on){n.x=lerp(n.x,clamp(P.x+n.side*30,14,W-14),1-Math.pow(.001,dt));n.y=lerp(n.y,P.y,1-Math.pow(.0005,dt));n.timer-=dt;n.buzz=(n.buzz||0)-dt;if(n.buzz<=0){n.buzz=3;shake=.18;try{navigator.vibrate&&navigator.vibrate(120);}catch(e){}}
      if(Math.random()<dt*2)P.parts.push({x:n.x,y:n.y-60,vx:rnd(-15,15),vy:-40,life:.8,col:'#ff6fae',r:3});
      if(n.timer<=0){n.timer=10;P.floor-=90;shake=.35;sfx.thud();news(n.k==='agent'?'SEEN TOGETHER AGAIN. "ALLEGED AGENT"':'SEEN TOGETHER AGAIN. "VP, HEALTH CARE"',2.6);say('Headline. The floor rises.',1.2,'#f0a0a0');}
      continue;}
    n.x+=n.vx*dt;if(n.k==='vp')n.y+=Math.sin(n.t*2)*18*dt;
    if(n.k==='agent'&&Math.random()<dt*3)P.parts.push({x:n.x-10,y:n.y-30,vx:-n.vx*.3+rnd(-20,20),vy:rnd(20,60),life:rnd(.6,1.1),col:'#fffdf5',r:3});
    if(P.inv<=0&&Math.abs(n.x-P.x)<22&&Math.abs((n.y-24)-(P.y-26))<30){P.inv=1.2;n.on=true;n.timer=10;n.side=n.x<P.x?-1:1;n.vx=0;
      P.vy=-950;P.canJump=true;burst(P.x,P.y-30,14,'#ff6fae',220);sfx.boing(1.8);
      say(n.k==='agent'?'A date in Singapore! Huge jump. She stays with you now.':'Dinner with the VP! Huge jump. She stays with you now.',2,'#ff6fae');}}
  P.npcs=P.npcs.filter(n=>n.on||(n.x>-80&&n.x<W+80&&n.y<P.floor));
  if(P.evt<EVENTS.length&&PLAYT>=EVENTS[P.evt][0]){const e=EVENTS[P.evt++];news(e[1]);e[2]();}
  else if(P.evt>=EVENTS.length&&PLAYT>=P.nextGeneric){P.nextGeneric=PLAYT+40;news(pick(GENERIC));}
  const L=keyL()||(pDown&&pX<W/2),R=keyR()||(pDown&&pX>=W/2);
  const tx=L&&!R?-PX:R&&!L?PX:0;P.vx=lerp(P.vx,tx,1-Math.pow(.0008,dt));
  P.vy+=G*dt;const py=P.y;P.y+=P.vy*dt;P.x=clamp(P.x+P.vx*dt,14,W-14);
  if(P.land>0){P.land-=dt;if(P.land<=0)P.pose='fall';}
    if(P.vy>0)for(const p of P.plats){if(p.gone)continue;const w=p.w,x=p.x;if(py<=p.y+1&&P.y>=p.y-1&&P.x>x-6&&P.x<x+w+6){P.y=p.y;landOn(p);break;}}
  P.fs=Math.min(110,16+PLAYT*.5+(P.fsBonus||0));P.floor-=P.fs*dt;
  // the floor never lags more than maxGap below the CEO, and maxGap shrinks with difficulty
  const maxGap=START_GAP*lerp(.85,.4,LVL());if(P.floor>P.y+maxGap)P.floor=lerp(P.floor,P.y+maxGap,1-Math.pow(.05,dt));
  P.cam=lerp(P.cam,P.y-H*.45,1-Math.pow(.002,dt));
  P.plats=P.plats.filter(p=>p.y>P.cam-420&&p.y<P.floor+40&&p.y<P.cam+H+700&&p.gone<1.01);
  for(const p of P.plats){if(p.gone)p.gone+=dt*2;if(p.wob>0)p.wob-=dt*3;}
  if(P.plats.length){const ys=P.plats.map(p=>p.y);P.top=Math.min(...ys);P.bot=Math.max(...ys);}else{P.top=P.bot=P.y;}
  genPlats();
  for(const q of P.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt;q.life-=dt;}P.parts=P.parts.filter(q=>q.life>0);
  if(P.planeX!==null){P.planeX+=220*dt;if(P.planeX>W+60)P.planeX=null;}
  // senators' envelopes: fall from above, push the CEO down on contact
  if(P.envT>0){P.envT-=dt;if(Math.random()<dt*1.6)P.env.push({x:rnd(20,W-20),y:P.cam-40,vy:rnd(160,240),r:0});}
  for(const e of P.env){e.y+=e.vy*dt;e.r+=dt*3;if(Math.abs(e.x-P.x)<18&&Math.abs(e.y-(P.y-28))<22){e.y=1e9;P.vy=Math.max(P.vy,0)+260;sfx.hurt();say('Subpoena! Pushed down.',.9,'#f0a0a0');}}
  P.env=P.env.filter(e=>e.y<P.floor&&e.y<P.cam+H+60);
  P.cap=5*clamp((P.floor-P.y)/START_GAP,0,1.1);
  if(P.y>=P.floor-2){P.y=P.floor;S.finalT=PLAYT;sfx.thud();shake=.5;goNow('over');}
}
const moodOf=c=>c>3.5?0:c>2?1:c>1?2:3;
function chart(cam,par=.5,cliff=false){

    txt('Nvidia, November 8–12, 2026',W/2,86,14,'#9a9a9a','center',400);
    marker(16+3,104,W-32,418,'#000',.6);marker(16,100,W-32,418,'#222',1);inkRect(16,100,W-32,418,3,NV);
    const L=[
      ['Nov 8','CEO Jensen Huang sent a letter to employees admitting an affair. Reports say the woman is suspected, allegedly, of being a Chinese intelligence agent. Beijing denied it.'],
      ['Nov 9','The stock fell about 5%, roughly $190 billion in one day.'],
      ['Nov 10','The independent directors opened an independent investigation led by an outside lawyer.'],
      ['Nov 11','The NYT reported a second affair with a company executive. The WSJ: the board was preparing to oust him.'],
      ['Nov 12','Huang resigned as President, CEO and board member, effective immediately. CFO Colette Kress became interim CEO. The stock fell another ~10% pre-market.'],
    ];
    let y=124;L.forEach(([d,s])=>{sticker(d,52,y+6,12,'#f0a0a0',-.05);const ls=wrap(s,12,W-120);ls.forEach((l,k)=>txt(l,88,y+k*15,12,INK,'left',400));y+=Math.max(2,ls.length)*15+12;});
    txt('This game is a parody. The character is fictional.',W/2,536,12,'#9a9a9a','center',400);
    txt('The spy allegation is unverified. Sources: Nvidia newsroom,',W/2,552,11,'#9a9a9a','center',400);
    txt('Washington Post, Yahoo Finance.',W/2,566,11,'#9a9a9a','center',400);
    hbtn('CONTINUE',W/2,606,180,46,NV,18);
    if(tapQueue.length){const p=tapQueue.shift();tapQueue.length=0;if(p.key||inBtn(p,W/2,606,220,60)){sfx.tick();go('community');}}
  }
};
const shareEl=document.getElementById('share'),shEl=document.getElementById('sh'),waEl=document.getElementById('wa'),cpEl=document.getElementById('cp'),grpEl=document.getElementById('grp');
if(navigator.share)shEl.hidden=false;
// Community overlays in canvas units: invite y=310..360, share y=444..490, personal y=504..554.
function placeShare(){const r=cv.getBoundingClientRect();const px=v=>(v*scale)+'px';
  shareEl.style.left=px(20+r.left/scale);shareEl.style.top=px(444+r.top/scale);shareEl.style.width=px(W-40);shareEl.style.height=px(46);shareEl.style.fontSize=px(14);
  grpEl.style.left=px(16+r.left/scale);grpEl.style.top=px(310+r.top/scale);grpEl.style.width=px(W-32);grpEl.style.height=px(244);grpEl.style.fontSize=px(13);}
shEl.addEventListener('click',()=>{const t=shEl.dataset.text||'';navigator.share({title:'Drop the Chip',text:t}).catch(e=>{if(!e||e.name!=='AbortError')window.open(waEl.href,'_blank','noopener');});});
cpEl.addEventListener('click',()=>{const s=cpEl.dataset.text||'';
  const ok=()=>{cpEl.textContent='Copied ✓';setTimeout(()=>{cpEl.textContent='Copy';},2200);};
  const fail=()=>{cpEl.textContent='Not copied';setTimeout(()=>{cpEl.textContent='Copy';},2200);};
  const legacy=()=>{try{const ta=document.createElement('textarea');ta.value=s;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,s.length);const r=document.execCommand('copy');document.body.removeChild(ta);r?ok():fail();}catch(e){fail();}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(ok).catch(legacy);else legacy();});
scenes.community={
  draw(dt){
    if(!S.init){S.init=true;const secs=S.secs||0;
      const text=`Drop the Chip 📉 I lasted ${fmt(secs)} before resigning. "${rankFor(secs)}". Your turn: ${PUBLIC_URL||location.href}`;
      waEl.href='https://wa.me/?text='+encodeURIComponent(text);cpEl.dataset.text=text;shEl.dataset.text=text;cpEl.textContent='Copy';shareEl.hidden=false;
      if(WA_GROUP||WA_ME){document.getElementById('grp1').hidden=!WA_GROUP;document.getElementById('grp2').hidden=!WA_ME;if(WA_GROUP)document.getElementById('grp1').href=WA_GROUP;if(WA_ME)document.getElementById('grp2').href='https://wa.me/'+WA_ME+'?text='+encodeURIComponent('Hi, I played "Drop the Chip" ');grpEl.hidden=false;}placeShare();}
    placeShare();paper();
    txt('Drop the Chip 📉',24,30,14,'#9a9a9a','left',700);
    ceo(W/2,150,'land',0,1.6,0);
    txt('The fall does not end here',W/2,210,30,INK,'center',900);
    txt('Get the next game first',W/2,278,24,INK,'center',900);
    txt('Your best: '+fmt(BEST),W/2,398,16,NV,'center',700);
    txt('Challenge your friend',W/2,422,20,INK,'center',900);
    hbtn('PLAY AGAIN',W/2,529,200,50,'#dcd4c0',18);
    if(tapQueue.length){const p=tapQueue.shift();tapQueue.length=0;if(p.key||inBtn(p,W/2,529,240,64)){go('title');}}
  }
};

// ---------- main loop ----------
let last=performance.now(),stepping=false;
function frame(now){
  const rawDt=clamp((now-last)/1000,0,.05);last=now;t+=rawDt;const dt=rawDt;
  inkT+=rawDt;if(inkT>.11){inkT=0;inkSeed++;}
  if(trans){trans.t+=rawDt/.5;if(trans.t>=.5&&pending){goNow(pending);pending=null;}if(trans.t>=1)trans=null;}
  ctx.save();if(shake>0){shake-=rawDt;ctx.translate(rnd(-5,5),rnd(-5,5));}
  scenes[scene].draw(dt);
  ctx.restore();
  drawTrans();
  if(flash>0){flash-=rawDt*2;ctx.fillStyle=`rgba(255,255,255,${Math.max(0,flash)})`;ctx.fillRect(0,0,W,H);}
  if(headline){headline.t+=rawDt;const a=Math.min(1,(headline.life-headline.t)*2,headline.t*4);if(a<=0)headline=null;else{ctx.globalAlpha=a;const y=52;marker(8,y-14,W-16,30,'#fbf5e6',1);inkRect(8,y-14,W-16,30,2.5,'#0b0b0b');hatch(8,y-14,W-16,30,'rgba(0,0,0,.06)',6);txt('BREAKING',34,y,10,'#c9403a','center',900);ink([[58,y-10],[58,y+10]],1.5,'#0b0b0b');
      font(12);let s=headline.s;while(ctx.measureText(s).width>W-96&&s.length>4)s=s.slice(0,-1);if(s!==headline.s)s=s.slice(0,-1)+'…';txt(s,66,y+1,12,'#0b0b0b','left',900);ctx.globalAlpha=1;}}
  if(toast){toast.t+=rawDt;const a=Math.min(1,(toast.life-toast.t)*2);if(a<=0)toast=null;else{ctx.globalAlpha=a;sticker(toast.s,W/2,headline?92:66,13,toast.bg,-.02);ctx.globalAlpha=1;}}
  if(!stepping)requestAnimationFrame(frame);
}
window.__advance=(sec)=>{stepping=true;const n=Math.round(sec*60);for(let i=0;i<n;i++)frame(last+1000/60);stepping=false;};
window.__state=()=>({scene,PLAYT,P:P&&{x:P.x,y:P.y,floor:P.floor,cap:P.cap,plats:P.plats.length,top:P.top,bot:P.bot}});
window.__go=s=>goNow(s);window.__setT=v=>{PLAYT=v;};window.__spawn=(k,dy=90,dx=-40)=>{if(P)P.plats.push(mk(k,P.y+dy,P.x+dx));};
const start=()=>{const h=location.hash.slice(1);if(scenes[h]&&h!=='title')goNow(h);else try{MUSIC.set('calm');}catch(e){}requestAnimationFrame(frame);};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(start);else start();
})();
