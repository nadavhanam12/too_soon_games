<script>
(()=>{
// ---------- publish config ----------
// PUBLIC_URL: the public game page (the itch.io page). Inside itch's iframe location.href is an
//   itch.zone address nobody should share, so the share text uses this instead.
//   Empty = fall back to location.href (fine when the file is hosted directly).
// WA_GROUP: WhatsApp group invite link (https://chat.whatsapp.com/...). Empty = the "join the group" line stays hidden.
const PUBLIC_URL='https://hanam.itch.io/plesentflight';
// WA_ME: personal WhatsApp number in international format without + (Israel: 972 + number without the leading 0). Empty hides the personal button.
const WA_ME='972547691089';
const WA_GROUP='https://chat.whatsapp.com/IS2YOSN4tLSByqjF0z9e86?mode=gi_t';
const W=360,H=640;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,ox=0,oy=0;
function fit(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const vw=window.innerWidth,vh=window.innerHeight;
  scale=Math.min(vw/W,vh/H);
  cv.style.width=(W*scale)+'px';cv.style.height=(H*scale)+'px';
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const r=cv.getBoundingClientRect();ox=r.left;oy=r.top;
}
window.addEventListener('resize',()=>{fit();if(typeof placeShare==='function'&&!shareEl.hidden)placeShare();});fit();

// ---------- helpers ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function font(sz,w=700){ctx.font=`${w} ${sz}px Rubik,system-ui,Arial`;}
function txt(s,x,y,sz=16,col='#f6f1e6',al='center',w=700){font(sz,w);ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline='middle';ctx.direction='rtl';ctx.fillText(s,x,y);}
function rr(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function circ(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function wrap(s,sz,maxW){font(sz,700);const words=s.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}
// speech bubble: box at (x,y) with a tail pointing to (tx,ty)
function bubble(s,x,y,sz=13,bg='#fff',fg='#111',tx=null,ty=null,nc=null){
  const lines=wrap(s,sz,290);let w=0;lines.forEach(l=>{w=Math.max(w,ctx.measureText(l).width);});w+=22;const lh=sz+5,h=lines.length*lh+12;
  x=clamp(x,w/2+6,W-w/2-6);
  rr(x-w/2,y-h/2,w,h,12,bg);
  if(tx!==null){const ax=clamp(tx,x-w/2+14,x+w/2-14);const dir=(ty??y+40)>y?1:-1;const by=y+dir*h/2;ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(ax-7,by);ctx.lineTo(ax+7,by);ctx.lineTo(tx,ty??(y+h/2+16));ctx.fill();}
  lines.forEach((l,i)=>{const ly=y-h/2+6+lh*i+lh/2;const ci=nc?l.indexOf(':'):-1;
    if(i===0&&ci>0)rich([[l.slice(0,ci+1),nc],[l.slice(ci+1),fg]],x,ly,sz);else txt(l,x,ly,sz,fg);});
}
function btn(s,x,y,w,h,col='#ffb400',fg='#111',sz=18){rr(x-w/2,y-h/2,w,h,h/2,col);txt(s,x,y+1,sz,fg,'center',900);}
function inBtn(p,x,y,w,h){return Math.abs(p.x-x)<w/2&&Math.abs(p.y-y)<h/2;}

// ---------- audio ----------
// Three layers: synth SFX (WebAudio, no files), a procedural engine-drone ambience, and looped music tracks from audio/*.mp3.
// Everything is created lazily on the first user gesture (autoplay policy) and fails silently if audio is unavailable.
let AC=null,MASTER=null,SFXBUS=null,NOISE=null;
function ac(){if(AC)return AC;AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=.9;MASTER.connect(AC.destination);SFXBUS=AC.createGain();SFXBUS.connect(MASTER);
  const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NOISE=b;return AC;}
const vary=(v,p=.05)=>v*(1+rnd(-p,p)); // small random pitch drift so repeated sounds never land identical
function tone(f,d,type='square',g=.06,o={}){try{const c=ac(),t0=c.currentTime,os=c.createOscillator(),v=c.createGain();os.type=type;os.frequency.setValueAtTime(vary(f),t0);
  if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t0+d);
  v.gain.setValueAtTime(.0001,t0);v.gain.linearRampToValueAtTime(g,t0+(o.attack||.004));v.gain.exponentialRampToValueAtTime(.0001,t0+d);
  let n=os;if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;os.connect(fl);n=fl;}n.connect(v);v.connect(SFXBUS);os.start(t0);os.stop(t0+d+.03);}catch(e){}}
function noise(d,g=.1,o={}){try{const c=ac(),t0=c.currentTime,s=c.createBufferSource(),v=c.createGain();s.buffer=NOISE;s.loop=true;s.playbackRate.value=vary(1,.08);
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(o.lp||20000,t0);if(o.lpEnd)lp.frequency.exponentialRampToValueAtTime(o.lpEnd,t0+d);lp.Q.value=o.q||.7;
  const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=o.hp||20;
  v.gain.setValueAtTime(.0001,t0);v.gain.linearRampToValueAtTime(g,t0+(o.attack||.005));v.gain.exponentialRampToValueAtTime(.0001,t0+d);
  s.connect(hp);hp.connect(lp);lp.connect(v);v.connect(SFXBUS);s.start(t0);s.stop(t0+d+.03);}catch(e){}}
const after=(ms,fn)=>setTimeout(fn,ms);
const sfx={
  // body bump into a passenger / suitcase: soft low thud with a little cloth rustle
  hit:()=>{noise(.16,.16,{lp:700,lpEnd:150});tone(120,.14,'sine',.12,{slide:55});},
  // fist landing: thud + bony crack
  punch:()=>{noise(.1,.2,{lp:2200,lpEnd:250});tone(95,.12,'triangle',.16,{slide:40});after(10,()=>noise(.03,.1,{hp:3500}));},
  // knife swish + stab impact
  stab:()=>{noise(.14,.12,{hp:1200,lp:7000,lpEnd:900});after(60,()=>{tone(160,.12,'sine',.12,{slide:60});noise(.08,.1,{lp:500});});},
  // failure / got hurt: a sour falling buzz with low knock
  bad:()=>{tone(230,.3,'sawtooth',.07,{slide:70,lp:900});noise(.18,.07,{lp:400});},
  // success: bright two-note pluck
  ok:()=>{tone(660,.1,'triangle',.07);tone(1320,.08,'sine',.02);after(80,()=>{tone(990,.16,'triangle',.07);tone(1980,.1,'sine',.02);});},
  // UI tap / counter: tiny soft click
  tick:()=>{noise(.025,.07,{hp:2500});tone(1400,.03,'sine',.03);},
  // lane change: air whoosh
  whoosh:()=>noise(.22,.09,{hp:300,lp:900,lpEnd:3800,attack:.05}),
  // door lock ring: metallic click
  click:()=>{tone(2300,.05,'square',.045);tone(3450,.04,'sine',.02);noise(.04,.1,{hp:4000});},
  // turbulence: long low rumble (plus a hit so the player feels it)
  rumble:()=>{noise(1.1,.16,{lp:220,attack:.08});tone(45,.9,'sine',.1,{attack:.1});},
  win:()=>{[523,659,784,1046].forEach((f,i)=>after(i*110,()=>{tone(f,.22,'triangle',.08);tone(f*2,.12,'sine',.02);}));after(440,()=>noise(.5,.05,{hp:5000,attack:.1}));},
  lose:()=>{[400,300,200,120].forEach((f,i)=>after(i*160,()=>tone(f,.28,'sawtooth',.07,{lp:1200})));noise(.9,.1,{lp:180,attack:.2});}
};

// engine-drone ambience: two detuned saws + brown-ish noise, level follows the scene (0..1)
const amb={on:false,level:-1,g:null,lp:null};
function ambStart(){if(amb.on)return;try{const c=ac();amb.g=c.createGain();amb.g.gain.value=0;amb.lp=c.createBiquadFilter();amb.lp.type='lowpass';amb.lp.frequency.value=260;amb.lp.connect(amb.g);amb.g.connect(MASTER);
  [52,55.5].forEach(f=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;const v=c.createGain();v.gain.value=.5;o.connect(v);v.connect(amb.lp);o.start();});
  const s=c.createBufferSource();s.buffer=NOISE;s.loop=true;const v=c.createGain();v.gain.value=.35;s.connect(v);v.connect(amb.lp);s.start();amb.on=true;}catch(e){}}
function ambSet(l){if(!amb.on||Math.abs(l-amb.level)<.01)return;amb.level=l;const t0=AC.currentTime;amb.g.gain.setTargetAtTime(l*.22,t0,.6);amb.lp.frequency.setTargetAtTime(180+l*700,t0,.6);}
const AMB_SCENE={title:0,facts:0,intro:.3,door:.35,cockpit:.35,tie:.3,tied:.3,run:.45,fly:.6,end:.15,lose:.2};
function ambLevel(){let l=AMB_SCENE[scene]??.3;if(scene==='door'&&S.turb>0)l+=.3;if(scene==='fly')l+=.25*Math.min(1,Math.max(0,-(S.pitch||0)));return Math.min(1,l);}

// music: looped mp3 tracks, crossfaded by volume; a missing file just means silence for that mood
const MUSIC_SCENE={title:'calm',intro:'calm',facts:'calm',run:'tense',door:'tense',cockpit:'tense',tie:'tense',tied:'tense',fly:'tense',end:'win',lose:null};
const MUSIC_VOL={calm:.32,tense:.38,win:.4};
const music={tracks:{},cur:null,unlocked:false};
['calm','tense','win'].forEach(n=>{const a=new Audio('audio/'+n+'.mp3');a.loop=true;a.preload='auto';a.volume=0;a.addEventListener('error',()=>{a.dataset.missing='1';});music.tracks[n]=a;});
function musicTick(dt){if(!music.unlocked)return;const want=MUSIC_SCENE[scene]===undefined?music.cur:MUSIC_SCENE[scene];
  if(want!==music.cur){music.cur=want;const a=want&&music.tracks[want];if(a&&!a.dataset.missing&&a.paused){a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{});}}
  for(const n in music.tracks){const a=music.tracks[n],target=n===music.cur?MUSIC_VOL[n]:0,v=a.volume+clamp(target-a.volume,-dt*1.2,dt*1.2);a.volume=clamp(v,0,1);if(target===0&&a.volume<.005&&!a.paused)a.pause();}}
function audioUnlock(){try{ac().resume();ambStart();}catch(e){}music.unlocked=true;}
window.addEventListener('pointerdown',audioUnlock,{once:true});window.addEventListener('keydown',audioUnlock,{once:true});
function audioTick(dt){musicTick(dt);if(amb.on)ambSet(ambLevel());}

// ---------- input ----------
const keys={};let pDown=false,pX=0,pY=0,pStartX=0,pStartY=0,tapQueue=[];
function toL(e){const r=cv.getBoundingClientRect();const sc=r.width/W||scale||1;return {x:(e.clientX-r.left)/sc,y:(e.clientY-r.top)/sc};}
cv.addEventListener('pointerdown',e=>{const p=toL(e);pDown=true;pX=pStartX=p.x;pY=pStartY=p.y;tapQueue.push(p);cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{const p=toL(e);pX=p.x;pY=p.y;});
cv.addEventListener('pointerup',()=>{pDown=false;});
cv.addEventListener('pointercancel',()=>{pDown=false;});
window.addEventListener('keydown',e=>{keys[e.key]=true;if([' ','Enter'].includes(e.key)){tapQueue.push({x:W/2,y:H/2,key:true});}if(e.key==='ArrowLeft')tapQueue.push({x:60,y:H/2,key:true,side:-1});if(e.key==='ArrowRight')tapQueue.push({x:W-60,y:H/2,key:true,side:1});if(e.key==='ArrowDown')tapQueue.push({x:W/2,y:H-60,key:true,block:true});if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.key]=false;});
const keyL=()=>keys['ArrowLeft']||keys['a'],keyR=()=>keys['ArrowRight']||keys['d'],keyU=()=>keys['ArrowUp']||keys['w'],keyD=()=>keys['ArrowDown']||keys['s'];

// ---------- game state ----------
let scene='title',t=0,st=0,shake=0,flash=0,score=0,stageScore={},ALT=34000,ALT_UP=null,DROP=false,altAnim=null;
const S={};
let toast=null;function say(s,life=1.6,col='#fff'){toast={s,life,col,t:0};}
let banner=null;function showBanner(title,lines,dur=2.6){banner={title,lines,t:0,dur};}
let trans=null,pending=null,sceneT=0;
function goNow(s){if(s!=='community'){shareEl.hidden=true;grpEl.hidden=true;}scene=s;st=0;sceneT=0;S.init=false;tapQueue.length=0;S.altEntry=ALT;}
const wsh=()=>shake>0?rnd(-5,5):0;
function go(s){if(pending===s||(trans&&trans.t<.5))return;pending=s;trans={t:0};}
const easeIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,easeO=x=>1-Math.pow(1-x,3);
function drawTrans(){if(!trans)return;const p=trans.t;let x,w;
  if(p<.5){w=W*easeIO(p*2);x=W-w;}else{w=W*(1-easeIO((p-.5)*2));x=0;}
  ctx.fillStyle='#ffb400';ctx.fillRect(x-4,0,w+8,H);ctx.fillStyle='#0f1a2b';ctx.fillRect(p<.5?x-14:x+w-4,0,14,H);}
window.__go=goNow;window.__dbg=()=>({ox,oy,scale,rect:cv.getBoundingClientRect()});window.__S=S;window.__state=()=>({scene,score,stageScore,ALT});window.__skipBanner=()=>{banner=null;};

const FAM={dad:'שמשון בוזגלו-שטרנליכט',mom:'פנינה-רוז',boy:'אוריאל-ג׳קי',girl:'מזל-טוב'};
const FC={dad:'#6aa5ff',mom:'#c98bff',boy:'#ffa23a',girl:'#ff7cb8'};
// centered rich text: parts = [[text,color],...] laid out right-to-left
function rich(parts,x,y,sz,w=700){font(sz,w);const ws=parts.map(p=>ctx.measureText(p[0]).width);const tot=ws.reduce((a,b)=>a+b,0);let cx=x+tot/2;parts.forEach((p,i)=>{txt(p[0],cx,y,sz,p[1],'right',w);cx-=ws[i];});}
let PLAYT=0;

function person(x,y,o={}){
  const sc=o.sc||1,shirt=o.shirt||'#2f6fdd',skin=o.skin||'#f2c9a0';
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  rr(-12,-8,24,26,8,shirt);
  circ(0,-18,10,skin);
  if(o.back){circ(-10,-17,3,skin);circ(10,-17,3,skin);if(o.hair!==false)circ(0,-19,10,o.hair||'#2a1a0a');else{ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-14,7,.25*Math.PI,.75*Math.PI);ctx.stroke();}ctx.restore();return;}
  if(o.hair!==false)rr(-10,-28,20,7,4,o.hair||'#2a1a0a');
  if(o.glasses){ctx.strokeStyle='#222';ctx.lineWidth=1.5;ctx.strokeRect(-9,-21,7,5);ctx.strokeRect(2,-21,7,5);}
  if(o.cap){rr(-12,-30,24,8,3,'#0d2a5a');}
  if(o.blood){circ(6,-12,4,'#c8102e');circ(-8,4,3,'#c8102e');}
  ctx.restore();
}
function walker(x,y,o,tm){ctx.save();ctx.translate(x,y);ctx.scale(o.sc||1,o.sc||1);const lg=o.walk?Math.sin(tm*12+x)*5:0;rr(-9,8,7,14+lg,3,o.pants||'#1b2a44');rr(2,8,7,14-lg,3,o.pants||'#1b2a44');person(0,0,o);
  if(o.longhair&&o.back){rr(-13,-28,26,30,8,o.hairCol||'#3a2a1a');}
  else if(o.longhair){rr(-13,-26,26,8,4,o.hairCol||'#3a2a1a');rr(-13,-24,6,22,3,o.hairCol||'#3a2a1a');rr(7,-24,6,22,3,o.hairCol||'#3a2a1a');}
  if(o.bow){circ(8,-28,4,'#ff5fa2');}ctx.restore();}
function suitcase(x,y,w,h,col){rr(x,y,w,h,5,col);rr(x+w/2-8,y-5,16,7,3,'#222');ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=2;ctx.strokeRect(x+6,y+4,w-12,h-8);}
function altChip(x,y,sc=1){const a=Math.max(0,Math.round(ALT/100)*100);const ground=ALT<=0&&!DROP;const low=ALT<10000&&!ground;

function hzn(cx,cy,r,pitch,bank,mask=true){
  ctx.save();if(mask){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();}
  ctx.translate(cx,cy);ctx.rotate(-bank);const off=pitch*r*0.9;
  ctx.fillStyle='#4aa8ff';ctx.fillRect(-r*2,-r*2+off,r*4,r*2);
  ctx.fillStyle='#8b5a2b';ctx.fillRect(-r*2,off,r*4,r*2);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;for(let i=-3;i<=3;i++){if(!i)continue;const y=off+i*r*0.22;ctx.beginPath();ctx.moveTo(-18,y);ctx.lineTo(18,y);ctx.stroke();}
  ctx.beginPath();ctx.moveTo(-r*2,off);ctx.lineTo(r*2,off);ctx.stroke();
  ctx.restore();
  ctx.strokeStyle='#ffb400';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx-r*0.6,cy);ctx.lineTo(cx-r*0.2,cy);ctx.lineTo(cx,cy+8);ctx.lineTo(cx+r*0.2,cy);ctx.lineTo(cx+r*0.6,cy);ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
}

  const fail=()=>{cpEl.textContent='לא הועתק';setTimeout(()=>{cpEl.textContent='העתק';},2200);};
  // some iframes (itch, claude.ai) block navigator.clipboard: fall back to a hidden textarea + execCommand, and only say "copied" when it really was
  const legacy=()=>{try{const ta=document.createElement('textarea');ta.value=s;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,s.length);const r=document.execCommand('copy');document.body.removeChild(ta);r?ok():fail();}catch(e){fail();}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(ok).catch(legacy);else legacy();});

// ---------- main loop ----------
let last=performance.now();
const DROP_SCENES=['intro','run','door','cockpit','tie','tied'];
let stepping=false;
function frame(now){
  const rawDt=clamp((now-last)/1000,0,.05);last=now;t+=rawDt;
  const paused=!!banner;const dt=paused?0:rawDt;
  if(trans){trans.t+=rawDt/.6;if(trans.t>=.5&&pending){goNow(pending);pending=null;}if(trans.t>=1)trans=null;}
  if(!paused)sceneT+=rawDt;const e=easeO(Math.min(1,sceneT/.4));
  ctx.save();
  if(shake>0)shake-=rawDt;
  ctx.translate(W/2,H/2);ctx.scale(1+(1-e)*.06,1+(1-e)*.06);ctx.translate(-W/2,-H/2+(1-e)*24);
  // altitude always bleeds once the chaos started; at 0 you lose
  if(DROP&&DROP_SCENES.includes(scene))ALT-=70*dt;
  if(DROP&&(DROP_SCENES.includes(scene)||scene==='fly'))PLAYT+=dt;
  // on the ground until the family is seated, then the plane is already cruising: climb to 34,000 during the calm bubble
  if(scene==='intro'&&!DROP){if(S.step==='walk'||S.step==='board'){ALT=0;ALT_UP=null;}else if(ALT<34000){ALT_UP=true;ALT=Math.min(34000,ALT+34000*dt/1.8);}else ALT_UP=null;}
  if(DROP&&ALT<=0&&scene!=='lose'&&scene!=='end'&&scene!=='title'){ALT=0;S.retryScene=scene;S.retryAlt=Math.max(4000,S.altEntry);S.retryScore=score-(stageScore[scene]||0);sfx.lose();goNow('lose');}
  if(banner){if(tapQueue.length&&banner.t>.5){banner=null;sfx.tick();}tapQueue.length=0;}
  audioTick(rawDt);
  scenes[scene].draw(dt);
  ctx.restore();
  if(altAnim){altAnim.t+=rawDt;const k=altAnim.t;const hold=1.6,fl=.6;if(k<hold){altChip(W/2,H/2-40,2.2);txt('הגובה יורד. תמהר.',W/2,H/2+10,16,'#fff','center',900);}else{const q=easeIO(Math.min(1,(k-hold)/fl));altChip(lerp(W/2,W-63,q),lerp(H/2-40,17,q),lerp(2.2,1,q));if(q>=1)altAnim=null;}}
  drawTrans();
  if(flash>0){flash-=rawDt;ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H);}
  if(toast){toast.t+=rawDt;const a=Math.min(1,(toast.life-toast.t)*2);if(a<=0)toast=null;else{ctx.globalAlpha=a;rr(24,44,W-48,36,18,'rgba(0,0,0,.65)');txt(toast.s,W/2,62,14,toast.col,'center',900);ctx.globalAlpha=1;}}
  if(banner){banner.t+=rawDt;const a=Math.min(1,banner.t*4);ctx.globalAlpha=a;ctx.fillStyle='rgba(10,16,28,.9)';ctx.fillRect(0,0,W,H);
    rr(24,200,W-48,240,18,'#1c2c48');txt(banner.title,W/2,246,26,'#ffb400','center',900);
    banner.lines.forEach((l,i)=>txt(l,W/2,296+i*28,16,'#fff','center',700));
    if(Math.sin(t*5)>-.2)txt('הקש כדי להתחיל',W/2,412,13,'#cfd8e6','center',400);ctx.globalAlpha=1;
    }
  if(!stepping)requestAnimationFrame(frame);
}
window.__advance=(sec)=>{stepping=true;const n=Math.round(sec*60);for(let i=0;i<n;i++)frame(last+1000/60);stepping=false;};window.__setAlt=v=>{ALT=v;};
const start=()=>{const h=location.hash.slice(1);if(scenes[h]&&h!=='title'){goNow(h);}requestAnimationFrame(frame);};
